name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests, lint and startup smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools" >&2
              exit 1
            fi
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          fi
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug assembleRelease assembleDebugAndroidTest
      - name: Run unit tests
        run: ./gradlew --no-daemon testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew --no-daemon lintDebug
      - name: Detect Android emulator acceleration
        id: emulator_accel
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "KVM acceleration is available."
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::KVM exists but is not usable; falling back to software emulation."
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This runner has no /dev/kvm; falling back to software emulation."
          fi
      - name: Launch activities in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          disable-linux-hw-accel: ${{ steps.emulator_accel.outputs.available != 'true' }}
          disable-animations: true
          script: bash .github/scripts/startup-smoke.sh && ./gradlew --no-daemon connectedDebugAndroidTest
      - name: Upload emulator diagnostics
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kebtee-emulator-diagnostics
          path: |
            app/build/diagnostics/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK
        if: success()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kebtee-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
