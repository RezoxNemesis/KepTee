name: Android CI

on:
  push:
    branches: [main, 'superpowers/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build, unit tests, lint and startup smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          else
            SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
            if [ -z "$SDKMANAGER" ]; then
              echo "Could not find sdkmanager under $SDK_ROOT/cmdline-tools" >&2
              exit 1
            fi
            echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          fi
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
      - name: Install Android SDK packages
        run: sdkmanager --install "platforms;android-35" "platforms;android-36" "build-tools;35.0.0"
      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug
      - name: Run unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Run Android lint
        run: gradle --no-daemon lintDebug
      - name: Launch activities in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disk-size: 2048M
          ram-size: 2048M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          pre-emulator-launch-script: |
            set -e
            # APK is already built. Free Gradle/NDK/CMake caches before the
            # Android 16 emulator creates its userdata partition.
            SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            rm -rf "$HOME/.gradle/caches" "$HOME/.gradle/wrapper/dists" "$GITHUB_WORKSPACE/.gradle"
            rm -rf "$SDK_ROOT/ndk" "$SDK_ROOT/cmake"
            find "$GITHUB_WORKSPACE/app/build" -mindepth 1 -maxdepth 1 ! -name outputs -exec rm -rf {} + 2>/dev/null || true
            df -h "$HOME"
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            bash .github/scripts/startup-smoke.sh
      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kebtee-emulator-diagnostics
          path: |
            app/build/diagnostics/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 14
      - name: Upload debug APK even when startup smoke fails
        id: upload_debug_apk
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kebtee-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
      - name: Publish APK release if artifact storage is unavailable
        if: always() && steps.upload_debug_apk.outcome == 'failure' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: keptee-build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: KepTee APK build ${{ github.run_number }}
          body: |
            Automated KepTee debug APK built from commit ${{ github.sha }}.
            The APK is published as a fallback because Actions artifact upload failed.
            Check the workflow logs for startup-smoke status before installing.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
