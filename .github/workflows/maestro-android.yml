name: KepTee Maestro Android UI Tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".maestro/**"
      - ".github/workflows/maestro-android.yml"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  pull_request:
    paths:
      - "app/**"
      - ".maestro/**"
      - ".github/workflows/maestro-android.yml"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keptee-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ui-test:
    name: Build, launch emulator, and test UI
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK and run unit tests and lint
        run: gradle --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Save debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keptee-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Run Maestro UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none
          disable-animations: true
          script: |
            set -uo pipefail
            mkdir -p test-results
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell pm grant com.rezoxnemesis.kebtee android.permission.POST_NOTIFICATIONS || true
            curl -Ls "https://get.maestro.mobile.dev" | bash
            export PATH="$HOME/.maestro/bin:$PATH"
            maestro --version
            set +e
            maestro test --format junit --output test-results/maestro-junit.xml .maestro/flows/core-ui.yaml 2>&1 | tee test-results/maestro.log
            test_status=${PIPESTATUS[0]}
            adb logcat -d -v threadtime > test-results/logcat.txt
            adb shell dumpsys activity activities > test-results/activities.txt
            find "$HOME/.maestro" -type f \( -name "*.png" -o -name "*.jpg" \) -exec cp -n {} test-results/ \; 2>/dev/null || true
            exit "$test_status"

      - name: Upload UI test evidence and crash diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keptee-maestro-test-evidence
          path: |
            test-results/**
            ~/.maestro/tests/**
          if-no-files-found: warn
          retention-days: 7
