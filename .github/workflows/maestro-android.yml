name: KepTee Maestro Android UI Tests

on:
  push:
    branches: [main]
    paths:
      - "app/src/main/java/**"
      - "app/src/main/kotlin/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/**"
      - "!app/src/main/res/drawable-nodpi/**"
      - "app/build.gradle.kts"
      - ".maestro/**"
      - ".github/workflows/maestro-android.yml"
      - ".github/scripts/run-maestro-ui.sh"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  pull_request:
    paths:
      - "app/src/main/java/**"
      - "app/src/main/kotlin/**"
      - "app/src/main/AndroidManifest.xml"
      - "app/src/main/res/**"
      - "!app/src/main/res/drawable-nodpi/**"
      - "app/build.gradle.kts"
      - ".maestro/**"
      - ".github/workflows/maestro-android.yml"
      - ".github/scripts/run-maestro-ui.sh"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keptee-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ui-test:
    name: Build, launch emulator, and test UI
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK and run unit tests and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Save debug APK
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: keptee-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Detect Android emulator acceleration
        id: emulator_accel
        shell: bash
        run: |
          set -euo pipefail
          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
            if [ -r /dev/kvm ] && [ -w /dev/kvm ]; then
              echo "available=true" >> "$GITHUB_OUTPUT"
              echo "KVM acceleration is available."
            else
              echo "available=false" >> "$GITHUB_OUTPUT"
              echo "::warning::KVM exists but is not usable; falling back to software emulation."
            fi
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::This runner has no /dev/kvm; falling back to software emulation."
          fi

      - name: Install Maestro before starting emulator
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
        run: |
          curl -fsSL --retry 3 https://get.maestro.mobile.dev -o /tmp/install-maestro.sh
          bash /tmp/install-maestro.sh
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version

      - name: Run Maestro UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -camera-back none -camera-front none
          ram-size: 2048M
          heap-size: 512M
          disk-size: 2048M
          disable-linux-hw-accel: ${{ steps.emulator_accel.outputs.available != 'true' }}
          disable-animations: true
          script: bash .github/scripts/run-maestro-ui.sh

      - name: Upload UI test evidence and crash diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: keptee-maestro-test-evidence
          path: |
            test-results/**
            ~/.maestro/tests/**
          if-no-files-found: warn
          retention-days: 7
