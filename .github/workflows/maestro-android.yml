name: KepTee Android Emulator UI Smoke Tests

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".maestro/**"
      - ".github/workflows/maestro-android.yml"
      - ".github/scripts/startup-smoke.sh"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  pull_request:
    paths:
      - "app/**"
      - ".maestro/**"
      - ".github/workflows/maestro-android.yml"
      - ".github/scripts/startup-smoke.sh"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - "gradle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keptee-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-ui-test:
    name: Build, launch emulator, and test UI
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK and run unit tests and lint
        run: gradle --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Save debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keptee-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore
          retention-days: 7

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          test -e /dev/kvm && ls -l /dev/kvm || echo "KVM device unavailable; emulator runner will use its supported fallback"

      - name: Run Maestro UI tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          emulator-boot-timeout: 900
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell getprop sys.boot_completed
            bash .github/scripts/startup-smoke.sh
            gradle --no-daemon connectedDebugAndroidTest

      - name: Upload emulator UI test evidence and crash diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keptee-emulator-ui-evidence
          path: |
            app/build/diagnostics/**
            app/build/reports/androidTests/connected/debug/**
            app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
          retention-days: 7
