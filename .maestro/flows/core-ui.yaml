appId: com.rezoxnemesis.kebtee
---
- launchApp:
    clearState: true
- assertVisible: "Make yourself at home"
- scrollUntilVisible:
    element: "Skip setup"
- tapOn: "Skip setup"
- assertVisible: "Open launcher"
- takeScreenshot: "keptee-settings"
- scrollUntilVisible:
    element: "15 FPS"
- tapOn: "15 FPS"
- assertVisible: "15 FPS selected"
- scrollUntilVisible:
    element: "Reduced motion toggle"
- assertVisible:
    text: "Reduced motion toggle"
    checked: false
- tapOn: "Reduced motion toggle"
- assertVisible:
    text: "Reduced motion toggle"
    checked: true
- takeScreenshot: "keptee-performance"
# Preferences must survive process death, not only Compose recomposition.
- stopApp
- launchApp
- assertNotVisible: "Make yourself at home"
- scrollUntilVisible:
    element: "15 FPS"
- assertVisible: "15 FPS selected"
- scrollUntilVisible:
    element: "Reduced motion toggle"
- assertVisible:
    text: "Reduced motion toggle"
    checked: true
- scrollUntilVisible:
    element: "Reset wallpaper settings"
- tapOn: "Reset wallpaper settings"
- tapOn: "Cancel"
- tapOn: "Reset wallpaper settings"
- tapOn: "Reset"
- scrollUntilVisible:
    element: "Reduced motion toggle"
    direction: UP
- assertVisible:
    text: "Reduced motion toggle"
    checked: false
- scrollUntilVisible:
    element: "30 FPS"
    direction: UP
- assertVisible: "30 FPS selected"
- scrollUntilVisible:
    element: "Open launcher"
    direction: UP
- tapOn: "Open launcher"
- assertVisible: "All apps"
- takeScreenshot: "keptee-home"
- tapOn: "All apps"
- assertVisible: "Search apps"
- takeScreenshot: "keptee-app-drawer"
- tapOn: "Search apps"
- inputText: "zzzkepteenomatchzzz"
- assertVisible: "No apps match that search."
- eraseText
- hideKeyboard
- assertNotVisible: "No apps match that search."
- takeScreenshot: "keptee-search-restored"
