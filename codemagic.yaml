workflows:
  keptee-android-debug:
    name: KepTee Android Debug APK
    max_build_duration: 60
    instance_type: linux_x2
    environment:
      java: 17
    scripts:
      - name: Verify Java and Gradle
        script: |
          java -version
          gradle --version
      - name: Build debug APK, unit tests, and lint
        script: |
          gradle --no-daemon clean assembleDebug testDebugUnitTest lintDebug
    artifacts:
      - app/build/outputs/**/*.apk
      - app/build/reports/**
      - app/build/test-results/**
